version: '3.8'

services:
  # 🧠 INGATAN VEKTOR (Buat PDF & RAG)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: emmy_brain
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: always

  # 📝 INGATAN CHAT (PostgreSQL)
  db:
    image: postgres:15
    container_name: emmy_diary
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: emmy
      # Password ini harus SAMA kayak di .env lu nanti
      POSTGRES_PASSWORD: ${DB_PASSWORD: "password_rahasia"} 
      POSTGRES_DB: bini_db
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    restart: always